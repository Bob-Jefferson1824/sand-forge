<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sandforge – Physics Sandbox</title>
<style>
:root{--bg:#0d0f14;--p:#161a22;--p2:#1f2531;--b:#2b3342;--t:#e6eaf2;--m:#8a94a8;--a:#ff8a3d}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--t);font:13px system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
#app{display:grid;grid-template-columns:250px 1fr;height:100%}
aside{background:var(--p);border-right:1px solid var(--b);display:flex;flex-direction:column;min-height:0;padding:10px;gap:8px}
h1{font-size:18px;letter-spacing:2px;color:var(--a)}h1 span{color:var(--t);font-weight:300}
input[type=text]{width:100%;background:var(--p2);border:1px solid var(--b);color:var(--t);padding:7px 9px;border-radius:6px;outline:0}
input[type=text]:focus{border-color:var(--a)}
#cats{display:flex;flex-wrap:wrap;gap:4px}
button,select{background:var(--p2);color:var(--t);border:1px solid var(--b);border-radius:6px;padding:6px 9px;cursor:pointer;font:inherit;transition:.12s}
button:hover,select:hover{border-color:var(--a);transform:translateY(-1px)}
button.on{background:var(--a);color:#111;border-color:var(--a);font-weight:600}
#els{overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:5px;align-content:start;flex:1}
.el{display:flex;align-items:center;gap:6px;text-align:left;padding:5px 6px;font-size:12px}
.sw{width:14px;height:14px;border-radius:3px;flex:none;box-shadow:inset 0 0 0 1px #0006}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
#bar{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 10px;background:var(--p);border-bottom:1px solid var(--b);align-items:center}
.g{display:flex;gap:4px;align-items:center;flex-wrap:wrap}label{color:var(--m);display:flex;gap:5px;align-items:center}
input[type=range]{width:90px;accent-color:var(--a)}
#stage{flex:1;position:relative;min-height:0}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
#status{display:flex;gap:16px;padding:5px 10px;background:var(--p);border-top:1px solid var(--b);color:var(--m);padding-bottom:calc(5px + env(safe-area-inset-bottom,0px))}
#status b{color:var(--t)}
#toast{position:absolute;left:50%;top:12px;transform:translate(-50%,-30px);background:var(--a);color:#111;padding:6px 14px;border-radius:20px;opacity:0;transition:.25s;pointer-events:none;font-weight:600}
#toast.s{opacity:1;transform:translate(-50%,0)}
dialog{background:var(--p);color:var(--t);border:1px solid var(--b);border-radius:10px;padding:16px;min-width:300px;margin:auto}dialog::backdrop{background:#000a}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--b)}
@media(max-width:760px){#app{grid-template-columns:1fr;grid-template-rows:1fr 200px}aside{order:2;border-right:0;border-top:1px solid var(--b)}h1{display:none}}
</style></head><body>
<div id="app"><aside><h1>SAND<span>FORGE</span></h1><input type="text" id="q" placeholder="Search elements…"><div id="cats"></div><div id="els"></div></aside>
<main><div id="bar">
<div class="g" id="tools"></div>
<div class="g"><button id="play">⏸ Pause</button><button id="stepb">⏭ Step</button><button id="slow">🐢 Slow</button><label>Speed<input type="range" id="spd" min=".1" max="4" step=".1" value="1"></label></div>
<div class="g"><label>Brush<input type="range" id="bs" min="0" max="20" value="3"></label><label>Heat<input type="range" id="hs" min="10" max="300" value="80"></label><label><input type="checkbox" id="fillc">Filled shapes</label></div>
<div class="g"><button id="rnd">🎲 Random</button><button id="clr">🗑 Clear</button><select id="size"><option value="0">Small 240×150</option><option value="1" selected>Medium 360×225</option><option value="2">Large 480×300</option><option value="3">Huge 640×400</option></select><button id="newb">✦ New world</button></div>
<div class="g"><button id="save">💾 Save</button><button id="load">📂 Load</button><button id="zi">＋</button><button id="zo">－</button><button id="fit">⤢ Fit</button></div>
</div><div id="stage"><canvas id="cv"></canvas><div id="toast"></div></div>
<div id="status"><span>Element: <b id="sel"></b></span><span id="hov">–</span><span>Particles: <b id="cnt">0</b></span><span><b id="fps">0</b> fps</span><span style="margin-left:auto">Space pause · [ ] brush · right-drag/2-finger pan · wheel zoom</span></div></main></div>
<dialog id="dlg"><h3 style="margin-bottom:8px">Saved worlds</h3><div id="slots"></div><button id="dclose" style="margin-top:10px">Close</button></dialog>
<script>
// ---------- element definitions ----------
const E=[],ID={};
function def(k,n,c,col,kind,d,o){const e=Object.assign({id:E.length,key:k,name:n,cat:c,col,kind,dens:d,t0:20,k:.05,hc:1,visc:1,air:.25},o||{});E.push(e);ID[k]=e.id}
def('empty','Empty','','#0b0d12','e',0);
const S='Solids',L='Liquids',G='Gases',X='Special',N='Nature';
def('sand','Sand',S,'#e3c77a','p',1.6,{wets:'wetsand',hot:[900,'glass']});
def('wetsand','Wet Sand',S,'#b99a52','p',1.9,{hc:2,hot:[100,'sand']});
def('stone','Stone',S,'#7d828c','s',9,{hot:[1400,'lava'],k:.06,sol:.08});
def('dirt','Dirt',S,'#7a5232','p',1.5,{wets:'mud',sol:.15});
def('mud','Mud',S,'#4e3623','l',1.7,{visc:.25,flow:1,hc:2,hot:[100,'dirt']});
def('wood','Wood',S,'#8a5a2b','s',9,{ign:300,ignp:.04,fl:200,spread:.05,sol:.1,k:.02,hc:3,absorb:1});
def('metal','Metal',S,'#a9b4c2','s',9,{k:.4,cond:1,hot:[1100,'lava'],sol:.04});
def('glass','Glass',S,'#9fd8e8','s',9,{hot:[1150,'lava']});
def('brick','Brick',S,'#a8483a','s',9,{sol:.05});
def('ice','Ice',S,'#bfe8ff','s',9,{t0:-10,hc:2,hot:[1,'water']});
def('snow','Snow',S,'#f2f6fb','p',.6,{t0:-10,hot:[2,'water']});
def('coal','Coal',S,'#2a2a2e','p',1.4,{ign:400,fl:300,spread:.02,absorb:1});
def('ash','Ash',S,'#8d8a86','p',.9);
def('water','Water',L,'#3b7de0','l',1,{hc:3,evap:1,ext:1,cold:[0,'ice'],cond:.12,wet:1});
def('saltwater','Salt Water',L,'#5a9ae0','l',1.05,{hc:3,evap:1,ext:1,cold:[-4,'ice'],cond:.6,wet:1});
def('oil','Oil',L,'#4a3b22','l',.8,{ign:230,fl:70,spread:.3});
def('lava','Lava',L,'#ff5a1a','l',3,{t0:1300,hc:4,k:.08,air:.01,visc:.3,cold:[650,'stone']});
def('acid','Acid',L,'#8cff3a','l',1.15,{acid:1});
def('mercury','Mercury',L,'#c9ced6','l',13.6,{cond:1});
def('honey','Honey',L,'#e0a21a','l',1.4,{visc:.12});
def('blood','Blood',L,'#a3121c','l',1.05);
def('steam','Steam',G,'#d8e4ee','g',-.5,{t0:110,k:.02,dis:.0008});
def('smoke','Smoke',G,'#555a62','g',-.3,{dis:.012});
def('oxygen','Oxygen',G,'#9bd0ff','g',-.05,{ign:380,fl:8,spread:.5});
def('hydrogen','Hydrogen',G,'#e8f4ff','g',-.9,{ign:300,fl:10,spread:.8});
def('co2','Carbon Dioxide',G,'#7a8a86','g',.3,{dis:.0005});
def('poison','Poison Gas',G,'#9a4fd0','g',.2,{dis:.001});
def('fire','Fire',X,'#ff7a1c','g',-.3,{t0:600,l0:40,k:.3,pal:['#ff3d00','#ff6a00','#ff8a1c','#ffb02e','#ffd24a','#ff5a00','#ff9a2a','#ffcc33']});
def('electricity','Electricity',X,'#fff27a','s',9,{l0:8});
def('plasma','Plasma',X,'#d36bff','g',-.7,{t0:2500,l0:50,k:.3});
def('radiation','Radiation',X,'#6dff7a','g',0,{l0:90});
def('void','Void',X,'#1a0030','s',9);
def('grass','Grass',N,'#3fae3f','s',9,{ign:250,fl:35,spread:.3,alive:1,absorb:1});
def('seed','Seeds',N,'#c9a85a','p',1.2,{alive:1,ign:300,fl:20,spread:.2});
def('tree','Tree',N,'#6b4a22','s',9,{l0:22,ign:280,fl:120,spread:.08,alive:1});
def('leaf','Leaves',N,'#2f8f3a','s',9,{ign:230,fl:30,spread:.25,alive:1,absorb:1});
def('flower','Flowers',N,'#ff5a7a','s',9,{ign:230,fl:25,spread:.3,alive:1,pal:['#ff5a7a','#ffd23f','#ffffff','#b46cff','#ff8a3d','#5ad2ff','#ff9ecb','#ffe9a0']});
def('vine','Vines',N,'#2b8a4a','s',9,{l0:18,ign:220,fl:30,spread:.3,alive:1});
def('algae','Algae',N,'#2f9e6a','s',9,{alive:1,ign:250,ignp:.2,fl:100,spread:.6,ashp:1});
def('bush','Bush','Life','#2d7a3a','s',9,{ign:240,fl:60,spread:.25,alive:1,absorb:1});
def('mushroom','Mushroom','Life','#c0392b','s',9,{pal:['#c0392b','#d9d2c0','#c0392b','#c0392b','#d9d2c0','#b03226','#c0392b','#e8e0d0'],ign:260,fl:30,spread:.2,alive:1,absorb:1});
def('berrybush','Berry Bush','Life','#2a6b34','s',9,{pal:['#2a6b34','#2a6b34','#2f7a3a','#c0213a','#2a6b34','#2f7a3a','#2a6b34','#d12a45'],ign:240,fl:60,spread:.25,alive:1,absorb:1});
def('fruit','Fruit','Life','#e0301f','p',1.2,{pal:['#e0301f','#e8452a','#d42a1a','#f0602a','#e0301f','#c8281a','#e8a02a','#e0301f'],ign:300,fl:20,spread:.3});
def('tulip','Tulip','Life','#ff4f7a','s',9,{pal:['#ff4f7a','#ff7aa0','#e8334f','#ffb3c6','#ff5a5a','#d6336c','#ff8fb0','#ff4f7a'],ign:230,fl:25,spread:.3,alive:1,absorb:1});
def('sunflower','Sunflower','Life','#ffd23f','s',9,{pal:['#ffd23f','#ffc21f','#ffe066','#7a4a1a','#ffd23f','#f5b700','#ffe066','#ffd23f'],ign:230,fl:25,spread:.3,alive:1,absorb:1});
def('bluebell','Bluebell','Life','#6a7bff','s',9,{pal:['#6a7bff','#8a5cff','#4f6bff','#a99bff','#6a7bff','#5a4fd6','#7f9bff','#6a7bff'],ign:230,fl:25,spread:.3,alive:1,absorb:1});
def('human','Human','Life','#e8a07a','e',0,{ent:1});
def('rabbit','Rabbit','Life','#c9b7a0','e',0,{ent:1});
def('fish','Fish','Life','#ff9a3c','e',0,{ent:1});
def('bird','Bird','Life','#4aa3e0','e',0,{ent:1});
def('ant','Ant','Life','#a0522d','e',0,{ent:1});
for(const e of E){if(e.hot)e.hot[1]=ID[e.hot[1]];if(e.cold)e.cold[1]=ID[e.cold[1]];if(e.wets)e.wets=ID[e.wets]}
const {sand:SAND,fire:FIRE,smoke:SMOKE,steam:STEAM,lava:LAVA,stone:STONE,water:WATER,acid:ACID,electricity:SPARK,plasma:PLASMA,radiation:RAD,void:VOID,poison:POISON,ash:ASH,seed:SEED,wood:WOOD,bush:BUSH,mushroom:MUSH,berrybush:BERRY,fruit:FRUIT,dirt:DIRT,mud:MUD,wetsand:WETSAND,grass:GRASS,tree:TREE,leaf:LEAF,flower:FLOWER,vine:VINE,algae:ALGAE}=ID;
// colour lookup (ABGR)
const LUT=new Uint32Array(E.length*8);
E.forEach(e=>{for(let k=0;k<8;k++){let h=e.pal?e.pal[k]:e.col,m=e.pal?1:1+(k-3.5)*.035;const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);const c=v=>Math.max(0,Math.min(255,v*m|0));LUT[e.id*8+k]=0xFF000000|c(b)<<16|c(g)<<8|c(r)}});
const BG=0xFF12100D,CH=0xFF66F0FF;
// ---------- world ----------
const SIZES=[[240,150],[360,225],[480,300],[640,400]];
let ents=[],cols=[],W,H,type,temp,life,vr,upd,fuel,stamp=0,frameN=0,off,octx,img,img32;
function init(w,h){ents=[];cols=[];W=w;H=h;const n=w*h;type=new Uint8Array(n);temp=new Float32Array(n).fill(20);life=new Uint16Array(n);vr=new Uint8Array(n);upd=new Uint8Array(n);fuel=new Uint8Array(n);off=document.createElement('canvas');off.width=w;off.height=h;octx=off.getContext('2d');img=octx.createImageData(w,h);img32=new Uint32Array(img.data.buffer);fit()}
const rnd=Math.random;
function put(i,id){const e=E[id];type[i]=id;fuel[i]=0;temp[i]=e.t0;life[i]=e.l0?Math.max(1,e.l0*(.7+rnd()*.6)|0):0;vr[i]=rnd()*8|0}
function sw(i,j){let a=type[i];type[i]=type[j];type[j]=a;a=temp[i];temp[i]=temp[j];temp[j]=a;a=life[i];life[i]=life[j];life[j]=a;a=vr[i];vr[i]=vr[j];vr[j]=a;a=fuel[i];fuel[i]=fuel[j];fuel[j]=a;upd[i]=upd[j]=stamp}
function can(j,d,dy){const t=type[j];if(!t)return true;const o=E[t];if(o.kind!=='l'&&o.kind!=='g')return false;return dy>0?o.dens<d:o.dens>d}
function ign(j){const o=E[type[j]];fuel[j]=o.ashp?1:0;type[j]=FIRE;life[j]=o.fl||35;if(temp[j]<600)temp[j]=600;upd[j]=stamp}
function tr(i,id,tp){type[i]=id;temp[i]=tp;life[i]=E[id].l0||0}
function heat(i,e,n,en,f){const kk=(en?(e.k+en.k)*.5:e.k*e.air)*f,d=((en?temp[n]:20)-temp[i])*kk;temp[i]+=d/e.hc;if(en)temp[n]-=d/en.hc}
function dryf(j){const o=E[type[j]];if(!o.absorb)return 1;const l=life[j];return l>=200?0:1-l/200}
function open(j){const t=type[j];return t===0||E[t].kind==='g'}
function exposed(i,x,y){return(x>0&&open(i-1))||(x<W-1&&open(i+1))||(y>0&&open(i-W))||(y<H-1&&open(i+W))}
function charge(j){const o=E[type[j]];if(o.cond&&life[j]===0&&rnd()<o.cond){life[j]=9;upd[j]=stamp}else if(o.ign&&rnd()<.15*dryf(j))ign(j)}
function leaves(cx,cy){for(let q=0;q<16;q++){const x=cx+(rnd()*7|0)-3,y=cy+(rnd()*5|0)-3;if(x>=0&&y>=0&&x<W&&y<H&&!type[y*W+x]){put(y*W+x,LEAF)}}}
const DX=[-1,0,1,-1,1,-1,0,1],DY=[-1,-1,-1,0,0,1,1,1];
function step(){stepGrid();entStep()}
function stepGrid(){
 stamp=stamp%255+1;frameN++;const st=stamp,w=W,h=H;
 for(let y=h-1;y>=0;y--){const lr=(y+frameN)&1;
  for(let xx=0;xx<w;xx++){const x=lr?w-1-xx:xx,i=y*w+x,t=type[i];
   if(t===0||upd[i]===st)continue;upd[i]=st;const e=E[t];
   const r=rnd()*8|0,nx=x+DX[r],ny=y+DY[r],n=(nx<0||ny<0||nx>=w||ny>=h)?-1:ny*w+nx,nt=n<0?0:type[n],en=nt?E[nt]:null;
   // heat
   if(t!==VOID){heat(i,e,n,en,.5);const r2=rnd()*8|0,a2=x+DX[r2],b2=y+DY[r2];if(a2>=0&&b2>=0&&a2<w&&b2<h){const m=b2*w+a2;heat(i,e,m,type[m]?E[type[m]]:null,.5)}else heat(i,e,-1,null,.5)}
   if(e.hot&&temp[i]>e.hot[0]){if((t===WETSAND||t===MUD)&&y>0&&!type[i-w])tr(i-w,STEAM,100);tr(i,e.hot[1],e.hot[0]);continue}
   if(e.cold&&temp[i]<e.cold[0]){tr(i,e.cold[1],e.cold[0]);continue}
   if(e.ign&&temp[i]>e.ign&&rnd()<(e.ignp||.1)*dryf(i)&&(e.kind!=='s'||exposed(i,x,y))){ign(i);continue}
   if(e.evap&&temp[i]>45){const T=temp[i];let p=0;if(T>85)p=Math.min(.12,.002+(T-85)*.0012);else if(y>0&&open(i-w))p=(T-45)*.00012;
    if(p&&rnd()<p){if(en&&en.kind!=='g')temp[n]-=20/en.hc;tr(i,STEAM,105);continue}}
   if(e.ext){let bo=false;for(let q=0;q<8;q++){const a=x+DX[q],b=y+DY[q];if(a<0||b<0||a>=w||b>=h)continue;const j=b*w+a,u=type[j];
     if(u===FIRE){{const dr=life[j]<40?8:4;if(life[j]>dr)life[j]-=dr;else{type[j]=rnd()<.5?STEAM:0;temp[j]=100;life[j]=0}}if(rnd()<.015)bo=true}
     else if(E[u].absorb&&rnd()<.15)life[j]=600}
    if(bo){tr(i,STEAM,105);continue}}
   // reactions
   if(t===FIRE){if(--life[i]<=0){const q=rnd();if(fuel[i]&&q<.5)tr(i,ASH,150);else type[i]=q<.2?SMOKE:0;fuel[i]=0;continue}
    if(fuel[i]&&life[i]===39){fuel[i]=0;if(rnd()<.6){tr(i,ASH,150);continue}}
    if(temp[i]<560)temp[i]=560;
    if(en){if(en.ign&&rnd()<(en.spread||.05)*dryf(n))ign(n);else if(en.wet){if(life[i]>3)life[i]-=3;else{if(rnd()<.5)tr(i,STEAM,100);else type[i]=0;continue}}}
    if(life[i]>=40){if(rnd()<.02&&y>0&&!type[i-w]){put(i-w,SMOKE)}continue}}
   else if(t===LAVA){for(let q=0;q<8;q++){const a=x+DX[q],b=y+DY[q];if(a<0||b<0||a>=w||b>=h)continue;const j=b*w+a,u=type[j];if(u&&E[u].wet){tr(j,STEAM,100);tr(i,STONE,650);for(let r=0;r<8;r++){const a2=x+DX[r],b2=y+DY[r];if(a2>=0&&b2>=0&&a2<w&&b2<h&&type[b2*w+a2]===LAVA)temp[b2*w+a2]-=400}break}}if(type[i]!==LAVA)continue}
   else if(t===ACID){if(en&&en.sol&&rnd()<en.sol){type[n]=rnd()<.3?POISON:0;if(rnd()<.4){type[i]=0;continue}}}
   else if(t===WATER){if(en&&en.wets&&rnd()<.03){type[n]=en.wets;if(rnd()<.6){type[i]=0;continue}}}
   else if(t===STEAM){let p=0;if(temp[i]<90)p=.003+(90-temp[i])*.0007;if(en&&en.kind!=='g'&&temp[n]<40)p+=.05;
    if(p&&rnd()<p){if(en&&en.kind!=='g')temp[n]+=8/en.hc;if(rnd()<.75)tr(i,WATER,55);else type[i]=0;continue}}
   else if(t===BUSH||t===BERRY){if(nt===MUD||nt===WETSAND)life[i]=600;
    if(life[i]>0&&temp[i]>5&&temp[i]<45&&rnd()<.002){const a=x+(rnd()*3|0)-1,b=rnd()<.15?y-1:y;if(a>=0&&a<w&&b>=0&&b<h-2&&!type[b*w+a]){const u=type[(b+1)*w+a],v=type[(b+2)*w+a];if(u===DIRT||u===GRASS||u===MUD||u===WETSAND||((u===BUSH||u===BERRY)&&(v===DIRT||v===GRASS||v===MUD)))put(b*w+a,t===BERRY&&rnd()<.5?BERRY:BUSH)}}
    if(t===BERRY&&life[i]>0&&y>0&&!type[i-w]&&rnd()<.002)put(i-w,FRUIT)}
   else if(t===MUSH){if(nt===MUD||nt===WETSAND)life[i]=600;if(life[i]>0&&temp[i]>3&&temp[i]<28&&rnd()<.0012){const a=x+(rnd()*3|0)-1;if(a>=0&&a<w&&y<h-1&&!type[y*w+a]){const u=type[(y+1)*w+a];if(u===DIRT||u===MUD||u===WETSAND||u===ASH)put(y*w+a,MUSH)}}}
   else if(t===LEAF){if(y<h-1&&!type[i+w]&&temp[i]>8&&temp[i]<38&&rnd()<.000004)put(i+w,FRUIT)}
   else if(t===SPARK){if(--life[i]<=0){type[i]=0;continue}for(let q=0;q<8;q++){const a=x+DX[q],b=y+DY[q];if(a>=0&&b>=0&&a<w&&b<h)charge(b*w+a)}continue}
   else if(t===PLASMA){if(--life[i]<=0){if(rnd()<.4){type[i]=FIRE;life[i]=25;fuel[i]=0}else type[i]=0;continue}temp[i]=1800;if(en&&en.ign&&rnd()<.3*dryf(n))ign(n)}
   else if(t===RAD){if(--life[i]<=0){type[i]=0;continue}if(en){if(en.alive&&rnd()<.1)type[n]=ASH}else if(n>=0)sw(i,n);continue}

 fish:(e,R)=>{ctx.fillStyle=['#ff9a3c','#4fc3f7','#ef5350','#ffd54f'][e.v%4];ctx.beginPath();ctx.ellipse(0,-.5,1.3,.6,0,0,6.3);ctx.fill();const s=Math.sin(e.ph)*.4;ctx.beginPath();ctx.moveTo(-1.1,-.5);ctx.lineTo(-2.1,-1.1+s);ctx.lineTo(-2.1,.1+s);ctx.fill();R('#111',.6,-.8,.3,.3)},
 bird:(e,R)=>{const c=['#4aa3e0','#e5533d','#f2c94c','#7bc67b'][e.v%4],f=e.st==='perch'?0:Math.sin(e.ph);ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(0,-1,1.3,.7,0,0,6.3);ctx.fill();R(c,.8,-1.9,.9,.9);R('#f2994a',1.7,-1.5,.7,.35);R('#111',1.3,-1.7,.25,.25);ctx.fillStyle='#0005';ctx.beginPath();ctx.moveTo(-.6,-1.2);ctx.lineTo(-1.6,-1.2-f*1.6);ctx.lineTo(.4,-1.2);ctx.fill();R(c,-2.2,-1.1,1,.4)},
 ant:(e,R)=>{const c='#2a1d16';R(c,-.6,-.65,.45,.45);R(c,-.1,-.6,.4,.4);R(c,.3,-.7,.4,.5);R(c,-.5,-.2,.1,.2);R(c,.1,-.2,.1,.2);if(e.cr)R('#e0301f',-.25,-1.3,.6,.6)}};
function drawEnts(){
 const R=(c,x,y,w,h)=>{ctx.fillStyle=c;ctx.fillRect(x,y,w,h)};
 for(const c of cols){ctx.fillStyle='#5a3d27';ctx.beginPath();ctx.ellipse(ox+(c.x+.5)*z,oy+(c.y+1)*z,2.2*z,1.1*z,0,Math.PI,0);ctx.fill()}
 for(const e of ents){if(e.sx===undefined){e.sx=e.x;e.sy=e.y}
  if(e.k==='ant'){e.sx+=(e.x-e.sx)*.35;e.sy+=(e.y-e.sy)*.35}else{e.sx=e.x;e.sy=e.y+e.oy}
  ctx.save();ctx.translate(ox+e.sx*z,oy+e.sy*z);ctx.scale(z*e.d,z);
  if(e.dead){ctx.globalAlpha=.55;if(e.k==='fish')ctx.scale(1,-1);else ctx.rotate(1.5708)}
  SP[e.k](e,R);ctx.restore()}}
// ---------- tools ----------
let sel=ID.sand,tool='brush',paused=false,speed=1,acc=0,stepReq=false,down=false,pan=false,shape=null,last=null,cur=null,r=3,heatS=80;
function stampAt(cx,cy,rad,id,dense){if(id>0&&E[id].ent)return;if(id===0&&ents.length)ents=ents.filter(e=>Math.hypot(e.x-cx-.5,e.y-ED[e.k].h/2-cy)>rad+1.5);const r2=rad*rad+rad*.8;
 for(let dy=-rad;dy<=rad;dy++)for(let dx=-rad;dx<=rad;dx++){if(dx*dx+dy*dy>r2)continue;const x=cx+dx,y=cy+dy;if(x<0||y<0||x>=W||y>=H)continue;const i=y*W+x;
  if(id===0){type[i]=0;temp[i]=20;life[i]=0;continue}
  if(id<0){if(type[i])temp[i]+=(id===-1?1:-1)*heatS*.15;continue}
  if(type[i])continue;const kd=E[id].kind;if(!dense&&(kd==='p'||kd==='g')&&rnd()<.6)continue;put(i,id)}}
function line(a,b,c,d,rad,id,dense){let dx=Math.abs(c-a),dy=Math.abs(d-b),sx=a<c?1:-1,sy=b<d?1:-1,e=dx-dy;for(;;){stampAt(a,b,rad,id,dense);if(a===c&&b===d)break;const e2=2*e;if(e2>-dy){e-=dy;a+=sx}if(e2<dx){e+=dx;b+=sy}}}
function toolId(){return tool==='erase'?0:tool==='heat'?-1:tool==='cool'?-2:sel}
function fill(x,y,id){if(id<=0||E[id].ent)return;const t0=type[y*W+x];if(t0===id)return;const stack=[y*W+x],seen=new Uint8Array(W*H);let c=0;
 while(stack.length&&c<250000){const i=stack.pop();if(seen[i]||type[i]!==t0)continue;seen[i]=1;c++;put(i,id);const px=i%W;if(px>0)stack.push(i-1);if(px<W-1)stack.push(i+1);if(i>=W)stack.push(i-W);if(i<W*H-W)stack.push(i+W)}}
function commit(s){const id=sel,f=document.getElementById('fillc').checked,[a,b,c,d]=[s.x0,s.y0,s.x1,s.y1];
 if(s.t==='line')line(a,b,c,d,r,id,1);
 else if(s.t==='rect'){if(f){for(let y=Math.min(b,d);y<=Math.max(b,d);y++)for(let x=Math.min(a,c);x<=Math.max(a,c);x++)if(x>=0&&y>=0&&x<W&&y<H&&!type[y*W+x])put(y*W+x,id)}else{line(a,b,c,b,r,id,1);line(c,b,c,d,r,id,1);line(c,d,a,d,r,id,1);line(a,d,a,b,r,id,1)}}
 else{const R=Math.round(Math.hypot(c-a,d-b));if(f)stampAt(a,b,R,id,1);else{const n=Math.max(12,R*7);let px=a+R,py=b;for(let q=1;q<=n;q++){const an=q/n*6.2832,x=Math.round(a+Math.cos(an)*R),y=Math.round(b+Math.sin(an)*R);line(px,py,x,y,r,id,1);px=x;py=y}}}}
function applyBrush(){if(!cur||(tool!=='brush'&&tool!=='erase'&&tool!=='heat'&&tool!=='cool'))return;const id=toolId();const l=last||cur;line(l.x,l.y,cur.x,cur.y,r,id,0);last=cur}
// ---------- view / input ----------
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');let z=2,ox=0,oy=0;
function resize(){const d=devicePixelRatio||1,b=cv.getBoundingClientRect();cv.width=b.width*d;cv.height=b.height*d;ctx.setTransform(d,0,0,d,0,0)}
function fit(){const b=cv.getBoundingClientRect();if(!b.width)return;z=Math.min(b.width/W,b.height/H)*.96;ox=(b.width-W*z)/2;oy=(b.height-H*z)/2}
new ResizeObserver(()=>{resize();fit()}).observe(document.getElementById('stage'));
function zoomAt(px,py,f){const nz=Math.max(.5,Math.min(40,z*f));ox=px-(px-ox)*nz/z;oy=py-(py-oy)*nz/z;z=nz}
const cell=(px,py)=>({x:Math.floor((px-ox)/z),y:Math.floor((py-oy)/z)});
const ptrs=new Map();let gest=null;
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.offsetX,e.offsetY,e.deltaY<0?1.15:1/1.15)},{passive:false});
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.offsetX,y:e.offsetY});
 if(ptrs.size===2){down=false;shape=null;const [p,q]=[...ptrs.values()];gest={d:Math.hypot(p.x-q.x,p.y-q.y),mx:(p.x+q.x)/2,my:(p.y+q.y)/2};return}
 if(e.button===1||e.button===2){pan=true;return}
 const c=cell(e.offsetX,e.offsetY);cur=c;
 if(tool==='pick'){const en=ents.find(q=>Math.abs(q.x-c.x-.5)<=ED[q.k].w/2+1&&c.y>=q.y-ED[q.k].h-1&&c.y<=q.y+1);if(en){setSel(ID[en.k]);setTool('brush');return}if(c.x>=0&&c.y>=0&&c.x<W&&c.y<H&&type[c.y*W+c.x]){setSel(type[c.y*W+c.x]);setTool('brush')}return}
 if(tool==='fill'){if(c.x>=0&&c.y>=0&&c.x<W&&c.y<H)fill(c.x,c.y,sel);return}
 if(['line','rect','circle'].includes(tool)){shape={t:tool,x0:c.x,y0:c.y,x1:c.x,y1:c.y};return}
 if(tool==='brush'&&E[sel].ent){spawn(E[sel].key,c.x,c.y);return}
 down=true;last=null});
cv.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);const c=cell(e.offsetX,e.offsetY);hover=c;
 if(p){const px=p.x,py=p.y;p.x=e.offsetX;p.y=e.offsetY;
  if(gest&&ptrs.size===2){const [a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;ox+=mx-gest.mx;oy+=my-gest.my;zoomAt(mx,my,d/gest.d);gest={d,mx,my};return}
  if(pan){ox+=e.offsetX-px;oy+=e.offsetY-py;return}}
 if(shape){shape.x1=c.x;shape.y1=c.y}cur=c});
const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)gest=null;if(shape){commit(shape);shape=null}down=false;pan=false;last=null};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
let hover=null;
// ---------- render ----------
function draw(){
 for(let i=0,n=W*H;i<n;i++){const t=type[i];img32[i]=t===0?BG:(t!==SPARK&&life[i]>0&&E[t].cond)?CH:(E[t].absorb&&life[i]>0)?(0xFF000000|((LUT[t*8+vr[i]]>>1)&0x7F7F7F)):LUT[t*8+vr[i]]}
 octx.putImageData(img,0,0);const b=cv.getBoundingClientRect();ctx.fillStyle='#08090c';ctx.fillRect(0,0,b.width,b.height);
 ctx.imageSmoothingEnabled=false;ctx.drawImage(off,ox,oy,W*z,H*z);ctx.strokeStyle='#3a4358';ctx.lineWidth=2;ctx.strokeRect(ox-1,oy-1,W*z+2,H*z+2);drawEnts();
 ctx.strokeStyle='#fff9';ctx.lineWidth=1;
 if(shape){const s=shape,f=document.getElementById('fillc').checked;ctx.strokeStyle='#ff8a3d';ctx.lineWidth=Math.max(1,(2*r+1)*z);ctx.lineCap='round';ctx.beginPath();const X=v=>ox+(v+.5)*z,Y=v=>oy+(v+.5)*z;
  if(s.t==='line'){ctx.moveTo(X(s.x0),Y(s.y0));ctx.lineTo(X(s.x1),Y(s.y1))}else if(s.t==='rect')ctx.rect(X(s.x0),Y(s.y0),(s.x1-s.x0)*z,(s.y1-s.y0)*z);else ctx.arc(X(s.x0),Y(s.y0),Math.hypot(s.x1-s.x0,s.y1-s.y0)*z,0,6.3);
  if(f&&s.t!=='line'){ctx.globalAlpha=.4;ctx.fillStyle='#ff8a3d';ctx.fill();ctx.globalAlpha=1}ctx.stroke();ctx.lineWidth=1}
 else if(hover&&!['fill','pick'].includes(tool)){ctx.strokeStyle='#fff9';ctx.beginPath();ctx.arc(ox+(hover.x+.5)*z,oy+(hover.y+.5)*z,(r+.5)*z,0,6.3);ctx.stroke()}}
// ---------- UI ----------
const $=id=>document.getElementById(id);let cat='All';
const TOOLS=[['brush','✏️ Brush'],['erase','⌫ Erase'],['line','╱ Line'],['rect','▭ Rect'],['circle','◯ Circle'],['fill','🪣 Fill'],['pick','⌖ Pick'],['heat','🔥 Heat'],['cool','❄️ Cool']];
TOOLS.forEach(([k,n])=>{const b=document.createElement('button');b.textContent=n;b.dataset.t=k;b.onclick=()=>setTool(k);$('tools').appendChild(b)});
function setTool(k){tool=k;[...$('tools').children].forEach(b=>b.classList.toggle('on',b.dataset.t===k));cv.style.cursor=k==='pick'?'copy':'crosshair'}
function setSel(id){sel=id;$('sel').textContent=E[id].name;buildEls()}
['All',S,L,G,X,N,'Life'].forEach(c=>{const b=document.createElement('button');b.textContent=c;b.onclick=()=>{cat=c;[...$('cats').children].forEach(x=>x.classList.toggle('on',x===b));buildEls()};if(c==='All')b.classList.add('on');$('cats').appendChild(b)});
function buildEls(){const q=$('q').value.trim().toLowerCase();$('els').innerHTML='';
 E.slice(1).filter(e=>(cat==='All'||e.cat===cat)&&e.name.toLowerCase().includes(q)).forEach(e=>{const b=document.createElement('button');b.className='el'+(e.id===sel?' on':'');b.innerHTML='<span class="sw" style="background:'+e.col+'"></span>'+e.name;b.onclick=()=>{sel=e.id;$('sel').textContent=e.name;if(['erase','pick','heat','cool','fill'].includes(tool)&&tool!=='fill')setTool('brush');buildEls()};$('els').appendChild(b)})}
$('q').oninput=buildEls;
let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('s');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('s'),1600)}
function setPause(p){paused=p;$('play').textContent=p?'▶ Play':'⏸ Pause'}
$('play').onclick=()=>setPause(!paused);$('stepb').onclick=()=>{setPause(true);stepReq=true};
let prevSpd=1;$('slow').onclick=()=>{if(speed>.3){prevSpd=speed;speed=.2;$('slow').classList.add('on')}else{speed=prevSpd;$('slow').classList.remove('on')}$('spd').value=speed};
$('spd').oninput=e=>{speed=+e.target.value;$('slow').classList.toggle('on',speed<=.3)};
$('bs').oninput=e=>r=+e.target.value;$('hs').oninput=e=>heatS=+e.target.value;
function clear(){type.fill(0);temp.fill(20);life.fill(0);ents=[];cols=[]}
$('clr').onclick=()=>{clear();toast('World cleared')};
$('newb').onclick=()=>{const[s,h]=SIZES[$('size').value];init(s,h);toast('New world '+s+'×'+h)};
$('rnd').onclick=()=>{const ids=E.filter(e=>e.id&&e.id!==VOID&&!e.ent).map(e=>e.id);for(let q=0;q<10;q++){const id=ids[rnd()*ids.length|0];stampAt(rnd()*W|0,rnd()*H*.7|0,3+rnd()*7|0,id,1)}toast('Random elements placed')};
$('zi').onclick=()=>{const b=cv.getBoundingClientRect();zoomAt(b.width/2,b.height/2,1.3)};$('zo').onclick=()=>{const b=cv.getBoundingClientRect();zoomAt(b.width/2,b.height/2,1/1.3)};$('fit').onclick=fit;
// save / load (localStorage, run-length encoded)
const KEY='sandforge_saves';const getSaves=()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}};
$('save').onclick=()=>{const name=prompt('Name your world:','World '+(Object.keys(getSaves()).length+1));if(!name)return;const rle=[];let p=type[0],c=0;for(let i=0;i<type.length;i++){if(type[i]===p&&c<65000)c++;else{rle.push(p,c);p=type[i];c=1}}rle.push(p,c);
 const s=getSaves();s[name]={w:W,h:H,rle,t:Date.now(),ents:ents.map(e=>Object.assign({},e)),cols:cols.map(c=>Object.assign({},c))};try{localStorage.setItem(KEY,JSON.stringify(s));toast('Saved “'+name+'”')}catch(e){toast('Save failed (storage full)')}};
function loadWorld(s){init(s.w,s.h);ents=(s.ents||[]).map(e=>Object.assign({},e));cols=(s.cols||[]).map(c=>Object.assign({},c));let i=0;for(let q=0;q<s.rle.length;q+=2){const t=s.rle[q],c=s.rle[q+1];for(let k=0;k<c;k++){if(t)put(i,t);i++}}}
function slots(){const s=getSaves(),box=$('slots');box.innerHTML='';const ks=Object.keys(s);if(!ks.length)box.textContent='No saved worlds yet.';ks.forEach(k=>{const d=document.createElement('div');d.className='row';d.innerHTML='<span>'+k.replace(/</g,'&lt;')+' <small style="color:var(--m)">'+s[k].w+'×'+s[k].h+'</small></span>';const l=document.createElement('button');l.textContent='Load';l.onclick=()=>{loadWorld(s[k]);$('dlg').close();toast('Loaded “'+k+'”')};const x=document.createElement('button');x.textContent='✕';x.onclick=()=>{delete s[k];localStorage.setItem(KEY,JSON.stringify(s));slots()};const g=document.createElement('span');g.append(l,' ',x);d.appendChild(g);box.appendChild(d)})}
$('load').onclick=()=>{slots();$('dlg').showModal()};$('dclose').onclick=()=>$('dlg').close();
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'&&e.target.type==='text')return;if(e.code==='Space'){e.preventDefault();setPause(!paused)}else if(e.key==='.'){setPause(true);stepReq=true}else if(e.key==='['){r=Math.max(0,r-1);$('bs').value=r}else if(e.key===']'){r=Math.min(20,r+1);$('bs').value=r}else if(e.key==='e')setTool('erase')});
// ---------- main loop ----------
let fr=0,lt=performance.now();
function loop(){requestAnimationFrame(loop);
 if(!paused){acc+=speed;let n=0;while(acc>=1&&n<6){step();acc--;n++}if(acc>1)acc=1}else if(stepReq){step();stepReq=false}
 if(down)applyBrush();draw();fr++;const now=performance.now();
 if(now-lt>500){$('fps').textContent=Math.round(fr*1000/(now-lt));fr=0;lt=now;let c=0;for(let i=0;i<type.length;i++)if(type[i])c++;$('cnt').textContent=c}
 if(hover&&hover.x>=0&&hover.y>=0&&hover.x<W&&hover.y<H){const i=hover.y*W+hover.x,t=type[i];$('hov').textContent=hoverText(i,t)}}
init(360,225);setTool('brush');setSel(ID.sand);resize();fit();
// starter scene
for(let x=0;x<W;x++)for(let y=H-14;y<H;y++)put(y*W+x,DIRT);
stampAt(60,H-30,12,WATER,1);stampAt(W-70,H-26,9,SAND,1);
loop();
